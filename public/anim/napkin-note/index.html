<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="/engine-bridge.js"></script>
<title>Napkin Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --text:#f4f1ea; --muted:#8f8b84; --panel:rgba(20,20,22,.8); --line:rgba(255,255,255,.1); --field:rgba(255,255,255,.05); --accent:#3450f0 }
  :root[data-theme="light"] { --bg:#e8e6e1; --text:#1c1b19; --muted:#6f6b65; --panel:rgba(255,255,255,.82); --line:rgba(0,0,0,.1); --field:rgba(0,0,0,.04) }
  * { box-sizing:border-box }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden; color:var(--text); font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif }
  canvas { display:block; width:100%; height:100% }
  .composer { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); width:min(660px, calc(100% - 32px));
    background:var(--panel); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:20px; padding:12px 14px; display:grid; gap:8px }
  .composer label.hint { color:var(--muted); font-size:12px; min-height:1.4em }
  textarea { width:100%; resize:none; background:transparent; border:0; color:var(--text); font:600 24px/1.25 "Caveat", "Segoe Print", cursive; min-height:2.6em; outline:none; padding:0 }
  textarea::placeholder { color:#6f6b65 }
  #sign { width:100%; height:38px; background:var(--field); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:2px 10px; font:30px/1 "Mrs Saint Delafield", "Segoe Script", cursive; outline:none }
  #sign::placeholder { font:13px system-ui, sans-serif; color:#6f6b65 }
  .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap }
  .feel { display:flex; align-items:center; gap:6px; padding:3px 11px 3px 3px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); font:inherit; font-size:13px; cursor:pointer }
  .feel img { width:26px; height:26px; border-radius:50%; background:#e9e6df }
  .feel[aria-pressed="true"] { color:var(--text); border-color:color-mix(in srgb, var(--text) 38%, transparent); background:var(--field) }
  .send { margin-left:auto; display:flex; align-items:center; gap:10px }
  .count { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums }
  .send button { background:var(--accent); color:#fff; border:0; border-radius:999px; padding:8px 18px; font:600 14px system-ui, sans-serif; cursor:pointer }
  .send button:disabled { opacity:.45; cursor:default }
  button:focus-visible, textarea:focus-visible, #sign:focus-visible { outline:2px solid var(--text); outline-offset:2px }
  .toast { position:fixed; top:18px; left:50%; transform:translate(-50%, -16px); opacity:0; pointer-events:none; transition:opacity .35s, transform .35s;
    background:var(--panel); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:14px; padding:10px 14px; display:flex; gap:10px; align-items:center; max-width:calc(100% - 32px) }
  .toast.show { opacity:1; transform:translate(-50%, 0); pointer-events:auto }
  .toast input { width:min(320px, 50vw); background:var(--field); border:1px solid var(--line); border-radius:8px; color:var(--muted); padding:5px 8px; font:12px ui-monospace, monospace }
  .toast button { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font:inherit; cursor:pointer }
  @media (max-width:560px) { .send { width:100%; justify-content:flex-end } }
  @media (prefers-reduced-motion: reduce) { .toast { transition:none } }
</style>

<body>
<canvas role="img" aria-label="A folded cloth napkin opens out and a needle sews its hem"></canvas>

<form class="composer" autocomplete="off">
  <label class="hint" for="msg" id="hint">Unfolding a fresh napkin…</label>
  <textarea id="msg" rows="2" maxlength="90" placeholder="Write something to sew…"></textarea>
  <input id="sign" maxlength="24" placeholder="Sign your name (optional)" aria-label="Signature">
  <div class="row">
    <div class="row" role="group" aria-label="Feeling to embroider" id="feelings"></div>
    <div class="send"><span class="count" id="count">0/90</span><button type="submit" id="sendBtn">Sew &amp; send</button></div>
  </div>
</form>
<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastText">Sent</span>
  <input id="toastLink" readonly aria-label="Link to this napkin">
  <button type="button" id="copyBtn">Copy link</button>
</div>

<script type="module">
import * as THREE from 'three';

/* @engine:params */
const params = {
  demo: "Thank you for the tea",
  unfold: "Random",
  floss: "#28379a",
  cloth: "#e6e0d6",
  grain: 0.06,
  wave: 1,
  swoopMs: 650,
  unfoldMs: 1800,
  hemMs: 4400,
  dprCap: 2
};
/* @engine:end */
const hex3 = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;

// ---------- timing ----------
// measured from cloth.mp4 (motiscope): the send-off burst -- corner peel then an accelerating exit to the top-left
const PEEL = [0, 450], EXIT = [300, 700];
function bezier(x1, y1, x2, y2) { // cubic-bezier(t) like CSS
  const f = (t, a, b) => 3 * a * t * (1 - t) ** 2 + 3 * b * t * t * (1 - t) + t ** 3;
  return x => {
    if (x <= 0 || x >= 1) return Math.max(0, Math.min(1, x));
    let lo = 0, hi = 1;
    for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; f(m, x1, x2) < x ? lo = m : hi = m; }
    return f((lo + hi) / 2, y1, y2);
  };
}
const easeIn = bezier(.42, 0, 1, 1);          // measured
const easeOut = bezier(.25, .46, .45, .94);   // landing decay, derived from the clip's energy curve
const easeInOut = bezier(.65, 0, .35, 1);     // unfolding (designed)
const span = (t, [a, b]) => Math.max(0, Math.min(1, (t - a) / (b - a)));
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = v => Math.max(0, Math.min(1, v));
// intro (designed): swoop in folded, open out, then the needle sews the hem
const SWOOP = [0, params.swoopMs], UNFOLD = [450, 450 + params.unfoldMs], HEM_AT = 550 + params.unfoldMs, HEM_MS = params.hemMs;

// ---------- cloth height: folded hem on all four edges + pressed quarter-fold lines (the weave is procedural) ----------
function clothHeight() {
  const S = 1024, c = Object.assign(document.createElement('canvas'), { width: S, height: S }), x = c.getContext('2d');
  const g = v => `rgb(${v * 255 | 0},${v * 255 | 0},${v * 255 | 0})`;
  const frame = inset => x.strokeRect(inset, inset, S - inset * 2, S - inset * 2);
  x.fillStyle = g(.5); x.fillRect(0, 0, S, S);
  const hem = S * .055;
  x.strokeStyle = g(.66); x.lineWidth = hem * 2; frame(0);
  x.strokeStyle = g(.34); x.lineWidth = 4; frame(hem + 3);
  x.strokeStyle = g(.44); x.lineWidth = 10;
  x.beginPath(); x.moveTo(S / 2, hem); x.lineTo(S / 2, S - hem); x.moveTo(hem, S / 2); x.lineTo(S - hem, S / 2); x.stroke();
  const o = Object.assign(document.createElement('canvas'), { width: S, height: S }), y = o.getContext('2d');
  y.filter = 'blur(1.5px)'; y.drawImage(c, 0, 0);
  return Object.assign(new THREE.CanvasTexture(o), { anisotropy: 8 });
}

// ---------- shared GLSL: how the sheet bends (used by the cloth and by every stitch, so thread rides the cloth) ----------
const DEFORM = /* glsl */`
uniform float uTime, uWave, uCrumple, uFan;
uniform vec4 uF0, uF1, uF2, uF3; // folds applied in order: (direction angle, line offset, radius, angle)
float foldAmt;
float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + 1.), f.x), f.y);
}
float ridge(float x) { float s = .5 + .5 * cos(x); return s * s; }
float wrinkles(vec2 p, float t) { // meandering soft folds in three directions + the pressed quarter-fold tent
  vec2 q = p + (vec2(vnoise(p * 2.1 + 3.1), vnoise(p * 2.1 - 7.7)) - .5) * .45;
  float a = ridge(dot(q, vec2(.94, .34)) * 10. + vnoise(q * 3.) * 3. + t * .4) * smoothstep(.25, .75, vnoise(q * 1.6 + 11.));
  float b = ridge(dot(q, vec2(-.42, .91)) * 14. + vnoise(q * 4. + 5.) * 3. - t * .3) * smoothstep(.3, .8, vnoise(q * 2. + 23.));
  float c = ridge(dot(q, vec2(.71, -.71)) * 20. + vnoise(q * 5. + 9.) * 2.) * smoothstep(.35, .85, vnoise(q * 2.6 + 37.));
  float press = exp(-abs(p.x) * 70.) + exp(-abs(p.y) * 70.);
  return (a * .6 + b * .4 + c * .22) * .06 + press * .012;
}
vec2 fold(vec2 q, float c, float R, float th) { // wrap everything past c over a cylinder of radius R, by th
  float s = q.x - c;
  if (s <= 0. || th <= 0.) return q;
  float a = min(s / R, th), rest = max(s - R * th, 0.), rr = R - q.y;
  foldAmt = max(foldAmt, min(a / 1.6, 1.));
  return vec2(c + rr * sin(a), R - rr * cos(a)) + rest * vec2(cos(th), sin(th));
}
vec3 applyFold(vec3 p, vec4 f) {
  if (f.w <= 0.) return p;
  vec2 d = vec2(cos(f.x), sin(f.x));
  float s = dot(p.xy, d);
  vec2 q = fold(vec2(s, p.z), f.y, f.z, f.w);
  return vec3(p.xy - d * s + d * q.x, q.y);
}
vec3 deform(vec2 xy) {
  float z = wrinkles(xy, uTime) * (1. + uCrumple * 1.5)
          + sin(xy.x * 7. + uTime * 9.) * sin(xy.y * 5. - uTime * 7.) * .045 * uWave;
  if (uCrumple > 0.) { // balled up: big lumpy relief, the sheet drawn in toward its centre
    vec2 j = vec2(vnoise(xy * 6. + 3.), vnoise(xy * 6. - 9.)) - .5;
    z += ((vnoise(xy * 5. + 17.) - .5) * .5 + (abs(vnoise(xy * 11.) - .5) - .25) * .3) * uCrumple;
    xy = xy * (1. - .62 * uCrumple) + j * .09 * uCrumple;
  }
  if (uFan > 0.) { // accordion pleats across x; length along each pleat is preserved
    float ang = uFan * 1.35, w = .0625;
    float tri = abs(fract(xy.x / (2. * w) + .25) * 2. - 1.) * 2. - 1.;
    z += tri * w * .5 * sin(ang);
    xy.x *= cos(ang);
  }
  vec3 p = applyFold(vec3(xy, z), uF0);
  p = applyFold(p, uF1);
  p = applyFold(p, uF2);
  return applyFold(p, uF3);
}`;

const clothVertex = /* glsl */`
${DEFORM}
varying vec2 vUv;
varying vec3 vViewPos, vN;
varying float vFold;
void main() {
  foldAmt = 0.;
  vec3 p = deform(position.xy);
  vFold = foldAmt;
  vec3 px = deform(position.xy + vec2(.003, 0.)) - p, py = deform(position.xy + vec2(0., .003)) - p;
  vUv = uv;
  vec4 mv = modelViewMatrix * vec4(p, 1.);
  vViewPos = mv.xyz;
  vN = normalMatrix * cross(px, py);
  gl_Position = projectionMatrix * mv;
}`;

const LIGHT = 'vec3(-.55, .7, .45)'; // low key light rakes the folds and the thread
const clothFragment = /* glsl */`
uniform sampler2D uHeight, uSewShadow;
uniform float uTime, uNeedleA, uGrain;
uniform vec3 uClothCol;
uniform vec4 uNeedle; // the needle's shadow on the cloth: tip end, eye end (napkin uv)
varying vec2 vUv;
varying vec3 vViewPos, vN;
varying float vFold;
const float PI = 3.14159265, THREADS = 150.;
float needleShadow(vec2 p) { // crisp where the tip touches the cloth, softer and fainter toward the raised eye
  vec2 a = uNeedle.xy, ab = uNeedle.zw - a;
  float t = clamp(dot(p - a, ab) / max(dot(ab, ab), 1e-6), 0., 1.), w = mix(.004, .018, t);
  return smoothstep(w, 0., length(p - a - ab * t)) * mix(.7, .32, t) * uNeedleA;
}
float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + 1.), f.x), f.y);
}
// plain weave: warp and weft take turns on top; each thread varies in thickness (slubs) and carries a twist
float weave(vec2 uv) {
  vec2 q = uv * THREADS, id = floor(q), f = fract(q);
  float over = mod(id.x + id.y, 2.);
  float sx = hash(vec2(id.x, 3.)), sy = hash(vec2(7., id.y));
  float warp = pow(sin(PI * f.x), .5 + sx) * (.55 + .45 * sin(PI * f.y));
  float weft = pow(sin(PI * f.y), .5 + sy) * (.55 + .45 * sin(PI * f.x));
  float twist = .07 * mix(sin((f.y * 1.5 + f.x * 5.) * 2. * PI), sin((f.x * 1.5 + f.y * 5.) * 2. * PI), over);
  float fuzz = (vnoise(uv * 2400.) - .5) * .15;
  return clamp(mix(weft * .85, warp, over) + twist + fuzz, 0., 1.);
}
float microWrinkles(vec2 uv) { return vnoise(uv * vec2(38., 26.) + vnoise(uv * 9.) * 2.) * vnoise(uv * 17. + 4.); }
void main() {
  float face = gl_FrontFacing ? 1. : 0.;
  vec2 uv = vec2(mix(1. - vUv.x, vUv.x, face), vUv.y); // the back shows the same cloth, mirrored
  vec2 dx = dFdx(uv), dy = dFdy(uv);
  float aa = clamp(1.6 - length(dx) * THREADS * 1.4, 0., 1.); // fade the weave once a thread shrinks under ~1px
  float w = weave(uv), m = microWrinkles(uv);
  const float e = 1. / 1024.;
  vec2 g = vec2(texture2D(uHeight, uv + vec2(e, 0.)).r - texture2D(uHeight, uv - vec2(e, 0.)).r,
                texture2D(uHeight, uv + vec2(0., e)).r - texture2D(uHeight, uv - vec2(0., e)).r) / (2. * e);
  // where thread pulls through, the cloth puckers and darkens (needle holes + contact shadow)
  float sh = texture2D(uSewShadow, vUv).a * face;
  vec2 sg = vec2(texture2D(uSewShadow, vUv + vec2(e, 0.)).a - texture2D(uSewShadow, vUv - vec2(e, 0.)).a,
                 texture2D(uSewShadow, vUv + vec2(0., e)).a - texture2D(uSewShadow, vUv - vec2(0., e)).a) / (2. * e) * face;
  float dBx = (weave(uv + dx) - w) * aa * .0009 + (microWrinkles(uv + dx) - m) * .006 + dot(g, dx) * .006 - dot(sg, dFdx(vUv)) * .0002;
  float dBy = (weave(uv + dy) - w) * aa * .0009 + (microWrinkles(uv + dy) - m) * .006 + dot(g, dy) * .006 - dot(sg, dFdy(vUv)) * .0002;
  vec3 n = normalize(vN) * (face * 2. - 1.);
  vec3 sx = dFdx(vViewPos), sy = dFdy(vViewPos);
  vec3 R1 = cross(sy, n), R2 = cross(n, sx);
  float det = dot(sx, R1);
  n = normalize(abs(det) * n - sign(det) * (dBx * R1 + dBy * R2));

  vec3 V = normalize(-vViewPos), L = normalize(${LIGHT});
  float NoL = dot(n, L), NoV = max(dot(n, V), 0.);
  float wv = mix(.5, w, aa);
  vec3 alb = uClothCol * (.86 + .14 * wv) * (.96 + .04 * hash(floor(uv * THREADS))) * (1. - sh * .5) * (1. - needleShadow(vUv) * face);
  float diff = max(NoL, 0.) * .88 + .12;
  float sheen = pow(1. - NoV, 4.) * .3 * (.35 + .65 * max(NoL, 0.)); // fuzzy fabric rim light
  vec3 col = alb * diff * (1. - vFold * .18) * (.8 + .2 * wv) + sheen;
  col = pow(col, vec3(1. / 2.2));
  col += (hash(gl_FragCoord.xy + fract(uTime * 7.3) * 91.) - .5) * uGrain; // film grain, like the source
  gl_FragColor = vec4(col, 1.);
}`;

// ---------- every stitch is a real little tube: it rises out of the cloth, bulges, and dives back in ----------
const threadVertex = /* glsl */`
${DEFORM}
uniform float uSew;          // sewing clock (ms since this napkin arrived)
attribute vec4 aAB;          // stitch start / end, in napkin uv
attribute vec4 aInfo;        // birth ms, duration ms, radius, side (+1 front, -1 back)
attribute vec3 aColor;
varying vec3 vViewPos, vN, vColor;
varying vec2 vPly;
varying float vDepth;
const float PI = 3.14159265;
void main() {
  float grow = clamp((uSew - aInfo.x) / max(aInfo.y, 1.), 0., 1.);
  if (grow <= 0.) { gl_Position = vec4(2., 2., 2., 1.); return; } // not sewn yet
  vec2 a = aAB.xy - .5, b = aAB.zw - .5, ab = b - a;
  float len = max(length(ab), 1e-5);
  vec2 dir = ab / len, perp = vec2(-dir.y, dir.x);
  float t = position.x * grow, th = position.y;
  float prof = pow(sin(PI * clamp(position.x, 0., 1.)), .35) * (grow < 1. ? smoothstep(0., .12, grow) : 1.); // tapers into the holes
  float r = aInfo.z * prof, side = aInfo.w;
  vec2 xy = a + ab * t;
  foldAmt = 0.;
  vec3 p0 = deform(xy);
  vec3 pp = deform(xy + perp * .002) - p0, pt = deform(xy + dir * .002) - p0;
  vec3 N = normalize(cross(pt, pp)) * side;
  vec3 P = deform(xy + perp * r * cos(th)) + N * (r * (1. + sin(th)) + .0004);
  vec4 mv = modelViewMatrix * vec4(P, 1.);
  vViewPos = mv.xyz;
  vN = normalMatrix * normalize(normalize(pp) * cos(th) + N * sin(th));
  vColor = aColor;
  vPly = vec2(t * len / .0042, th / (2. * PI));
  vDepth = prof;
  gl_Position = projectionMatrix * mv;
}`;
const threadFragment = /* glsl */`
uniform float uTime, uGrain;
varying vec3 vViewPos, vN, vColor;
varying vec2 vPly;
varying float vDepth;
float hash(vec2 p) { vec3 q = fract(vec3(p.xyx) * .1031); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }
void main() {
  vec3 n = normalize(vN) * (gl_FrontFacing ? 1. : -1.);
  vec3 V = normalize(-vViewPos), L = normalize(${LIGHT});
  float ply = .5 + .5 * sin((vPly.x + vPly.y * 3.) * 6.2831853);           // three twisted plies
  float groove = smoothstep(.0, .35, ply);
  vec3 alb = vColor * (.62 + .48 * ply) * (.55 + .45 * vDepth);           // darker where it dives into the cloth
  float diff = max(dot(n, L), 0.) * .85 + .15;
  float silk = pow(max(dot(reflect(-L, n), V), 0.), 22.) * .45 * groove;  // silky floss highlight on each ply
  vec3 col = alb * diff * (.75 + .25 * groove) + silk;
  col = pow(col, vec3(1. / 2.2));
  col += (hash(gl_FragCoord.xy + fract(uTime * 7.3) * 91.) - .5) * uGrain * .83;
  gl_FragColor = vec4(col, 1.);
}`;

// ---------- stitch designs: everything is a list of stitches { a, b (napkin uv), r, side, color } ----------
const FLOSS = () => params.floss; // indigo embroidery floss for lettering (params.floss)
const mk = (w, h = w) => Object.assign(document.createElement('canvas'), { width: w, height: h });
const rgb = hex => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };
const tint = ([r, g, b], k) => [r * k, g * k, b * k];
const dist = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);

function backstitch(pts, len, gap) { // fixed-length stitches laid end to end along a polyline
  const d = [0];
  for (let i = 1; i < pts.length; i++) d.push(d[i - 1] + dist(pts[i - 1], pts[i]));
  const total = d[d.length - 1], at = s => {
    let i = 1; while (i < d.length - 1 && d[i] < s) i++;
    const k = (s - d[i - 1]) / ((d[i] - d[i - 1]) || 1);
    return [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)];
  };
  const out = [];
  for (let s = 0; s < total - .5; s += len + gap) out.push([at(s), at(Math.min(s + len, total))]);
  return out;
}

// hem: a running stitch right round; the short back stitches sit under the cloth
function hemStitches(color) {
  const lo = .046, hi = 1 - lo, per = 36, front = .62, c = rgb(color), out = [];
  const corners = [[lo, hi], [hi, hi], [hi, lo], [lo, lo]]; // clockwise from the top-left (v points up)
  corners.forEach((p, k) => {
    const q = corners[(k + 1) % 4];
    for (let i = 0; i < per; i++) {
      const at = f => [lerp(p[0], q[0], (i + f) / per), lerp(p[1], q[1], (i + f) / per)];
      out.push({ a: at(0), b: at(front), r: .0034, side: 1, color: c });
      out.push({ a: at(front), b: at(1), r: .0028, side: -1, color: tint(c, .9) });
    }
  });
  return out;
}

// ---- lettering: set the text, thin it to one-pixel strokes, trace those, and backstitch along them ----
const HAND = '"Caveat", "Segoe Print", "Bradley Hand", cursive';
const SIGN = '"Mrs Saint Delafield", "Segoe Script", cursive';

resize();

// ---------- how a napkin arrives: swoop in folded, then open out -- a different way each time ----------
const REST = { x: .02, y: .02, rz: .19 }; // turned ~11deg, as in the clip
const PI = Math.PI, F0 = [0, 0, 0, 0];
const UNFOLDS = {
  quarters: u => { const s1 = clamp01(u * 2), s0 = clamp01(u * 2 - 1); return { folds: [[0, 0, .02, PI * (1 - s0)], [PI / 2, 0, .045, PI * (1 - s1)], F0, F0], offset: [.25 * (1 - s0), .25 * (1 - s1)] }; },
  letter: u => { const s1 = clamp01(u * 2), s0 = clamp01(u * 2 - 1); return { folds: [[0, 1 / 6, .02, PI * (1 - s0)], [PI, 1 / 6, .036, PI * (1 - s1)], F0, F0] }; },
  triangle: u => {
    const s1 = clamp01(u * 2), s0 = clamp01(u * 2 - 1);
    return { folds: [[.75 * PI, 0, .02, PI * (1 - s0)], [.25 * PI, 0, .04, PI * (1 - s1)], F0, F0], offset: [lerp(lerp(0, -.17, s1), 0, s0), lerp(lerp(.33, .17, s1), 0, s0)] };
  },
  envelope: u => ({ folds: [.25, .75, 1.25, 1.75].map((q, i) => [q * PI, .3536, .015 + i * .012, PI * (1 - clamp01(u * 1.7 - i * .23))]) }),
  crumple: u => ({ crumple: 1 - u, spin: (1 - u) * 2.2 }),
  fan: u => ({ fan: 1 - u }),
};
const LABELS = { quarters: 'folded in quarters', letter: 'letter-folded', triangle: 'folded into a triangle', envelope: 'folded like an envelope', crumple: 'crumpled into a ball', fan: 'pleated like a fan' };
const pose0 = () => ({ x: REST.x, y: REST.y, z: 0, rx: 0, ry: 0, rz: REST.rz, wave: 0, crumple: 0, fan: 0, folds: [F0, F0, F0, F0], offset: [0, 0], spin: 0 });
function introPose(unfold, el) {
  const sw = easeOut(span(el, SWOOP)), drop = 1 - sw, u = easeInOut(span(el, UNFOLD));
  const p = Object.assign(pose0(), UNFOLDS[unfold](u));
  Object.assign(p, { x: lerp(REST.x, 1.45, drop), y: lerp(REST.y, -1.3, drop), z: lerp(.08, 1.2, drop) * (1 - u), rx: .6 * drop, ry: -.4 * drop, rz: REST.rz - .8 * drop + p.spin });
  p.wave = .35 * params.wave * (1 - u) * (1 - sw * .5);
  return p;
}
function exitPose(a) { // measured send-off: corner peels back, the sheet accelerates away to the top-left
  const peel = easeIn(span(a, PEEL)), ex = easeIn(span(a, EXIT)), p = pose0();
  p.folds = [[-PI / 4, .707 - .5 * peel - .25 * ex, .12 + .05 * peel + .1 * ex, 2.9 * Math.sqrt(peel)], F0, F0, F0];
  return Object.assign(p, { x: lerp(REST.x, -.9, ex), y: lerp(REST.y, .35, ex), z: 2 * ex, rx: -.7 * ex, ry: .5 * ex, rz: REST.rz + .9 * ex, wave: ex });
}
function applyPose(p) {
  const c = Math.cos(p.rz), s = Math.sin(p.rz), [ox, oy] = p.offset; // re-centre a folded packet
  napkin.position.set(p.x + ox * c - oy * s, p.y + ox * s + oy * c, p.z);
  napkin.rotation.set(p.rx, p.ry, p.rz);
  shared.uWave.value = p.wave; shared.uCrumple.value = p.crumple; shared.uFan.value = p.fan;
  p.folds.forEach((f, i) => shared[`uF${i}`].value.set(...f));
}

// ---------- napkin lifecycle ----------
let nap, lastUnfold = null, count = 0, feeling = 'love';
function resetThreads() {
  count = 0; threadGeo.instanceCount = 0;
  shc.clearRect(0, 0, PX, PX); shadowTex.needsUpdate = true;
}
function addStitches(list) {
  for (const st of list) {
    if (count >= MAX) break;
    aAB.array.set([...st.a, ...st.b], count * 4);
    aInfo.array.set([st.birth, st.dur, st.r, st.side], count * 4);
    aColor.array.set(st.color, count * 3);
    nap.stitches.push(st);
    count++;
  }
  threadGeo.instanceCount = count;
  aAB.needsUpdate = aInfo.needsUpdate = aColor.needsUpdate = true;
}
function newNapkin(at, hemFeeling = feeling) {
  const options = Object.keys(UNFOLDS).filter(k => k !== lastUnfold);
  const unfold = UNFOLDS[params.unfold] ? params.unfold : options[Math.random() * options.length | 0];
  lastUnfold = unfold;
  nap = { born: reduce ? at - 1e6 : at, unfold, stitches: [], cursor: 0, shadowDone: 0, sewEnd: 0, hemEnd: 0, exitAt: null, msg: null };
  resetThreads();
  const hem = hemStitches(TOKENS[hemFeeling].parts[0].color);
  nap.hemEnd = nap.sewEnd = schedule(hem, HEM_AT, HEM_MS);
  addStitches(hem);
  canvas.setAttribute('aria-label', `A cloth napkin ${LABELS[unfold]} opens out, and a needle sews its hem`);
}
function sewMessage(msg, from) { // schedule lettering, signature and token after whatever is already being sewn
  const { words, sig } = letterStitches(msg), tok = tokenStitches(msg.feeling);
  let t = Math.max(from, nap.sewEnd) + 300;
  t = schedule(words, t, Math.min(6500, Math.max(2200, sewLength(words) * 700)));
  if (sig.length) t = schedule(sig, t + 250, Math.min(2200, Math.max(900, sewLength(sig) * 700)));
  t = schedule(tok, t + 300, 2600);
  addStitches([...words, ...sig, ...tok]);
  nap.sewEnd = t; nap.msg = msg;
  canvas.setAttribute('aria-label', `Cloth napkin with the stitched message “${msg.text}”${msg.sign ? `, signed ${msg.sign},` : ''} and an embroidered ${TOKENS[msg.feeling].label.toLowerCase()} token`);
}

// needle: follows the stitch being sewn -- up and over, then down through the cloth
const Y = new THREE.Vector3(0, 1, 0), heading = new THREE.Vector2(1, 0), tip = new THREE.Vector3(), axis = new THREE.Vector3(), eyePos = new THREE.Vector3(), hole = new THREE.Vector3(), mid = new THREE.Vector3();
function updateNeedle(sewT, time) {
  const S = nap.stitches;
  while (nap.cursor < S.length - 1 && S[nap.cursor + 1].birth <= sewT) nap.cursor++;
  const st = S[nap.cursor], next = S[nap.cursor + 1];
  const done = st.birth + st.dur, gapToNext = next ? next.birth - sewT : Infinity;
  const vis = reduce ? 0 : Math.min(clamp01((sewT - (st.birth - 300)) / 300), done > sewT ? 1 : clamp01(1 - (sewT - done) / 350) + (gapToNext < 300 ? 1 : 0));
  needle.visible = tail.visible = vis > .01 && sewT >= S[0].birth - 300;
  shared.uNeedleA.value = needle.visible ? vis : 0;
  if (!needle.visible) return;
  const g = clamp01((sewT - st.birth) / st.dur);
  const x = lerp(st.a[0], st.b[0], g) - .5, y = lerp(st.a[1], st.b[1], g) - .5;
  const bob = Math.sin(time * 18); // the hand rocks the needle in and out of the cloth, ~3 times a second
  tip.set(x, y, wrinkles(x, y, time) + .012 * bob - .004 + (1 - vis) * .12);
  const L = Math.hypot(st.b[0] - st.a[0], st.b[1] - st.a[1]) || 1;
  heading.lerp({ x: (st.b[0] - st.a[0]) / L, y: (st.b[1] - st.a[1]) / L }, .12).normalize(); // no snapping at every stitch
  const hx = heading.x, hy = heading.y;
  axis.set(-hx * .62 + hy * .38, -hy * .62 - hx * .38, .36 + .1 * bob).normalize(); // eye trails behind, leaning in over the cloth (the hem runs clockwise)
  needle.position.copy(tip);
  needle.quaternion.setFromUnitVectors(Y, axis);
  eyePos.copy(axis).multiplyScalar(.185).add(tip);
  const k = .9, z0 = wrinkles(x, y, time); // light rakes in from the upper left: shadows fall down and right
  const sx0 = tip.x + Math.max(0, tip.z - z0) * k, sy0 = tip.y - Math.max(0, tip.z - z0) * k;
  const sx1 = eyePos.x + (eyePos.z - z0) * k, sy1 = eyePos.y - (eyePos.z - z0) * k;
  shared.uNeedle.value.set(sx0 + .5, sy0 + .5, sx1 + .5, sy1 + .5);
  hole.set(st.a[0] - .5, st.a[1] - .5, wrinkles(st.a[0] - .5, st.a[1] - .5, time) + .002);
  mid.lerpVectors(hole, eyePos, .5); mid.x -= hy * .07; mid.y += hx * .07; mid.z = z0 + .012; // the floss sags away from the needle's lean
  tail.geometry.dispose();
  tail.geometry = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(hole, mid, eyePos), 16, .0024, 6);
  flossMat.color.setRGB(...st.color);
}

// ---------- compose, sew, send ----------
const form = document.querySelector('.composer'), msgEl = document.getElementById('msg'), countEl = document.getElementById('count');
const signEl = document.getElementById('sign'), sendBtn = document.getElementById('sendBtn'), hint = document.getElementById('hint'), feelingsEl = document.getElementById('feelings');
const toast = document.getElementById('toast'), toastText = document.getElementById('toastText'), toastLink = document.getElementById('toastLink');
const fontsReady = Promise.all([document.fonts.load('600 64px "Caveat"'), document.fonts.load('64px "Mrs Saint Delafield"')]).catch(() => {});
const within = (p, ms, fallback) => Promise.race([p, new Promise(r => setTimeout(() => r(fallback), ms))]);
let msgId = 0, toastTimer, received = false;

for (const [name, t] of Object.entries(TOKENS)) {
  const b = document.createElement('button');
  Object.assign(b, { type: 'button', className: 'feel', innerHTML: `<img alt="" src="${tokenThumb(name)}">${t.label}` });
  b.setAttribute('aria-pressed', name === feeling);
  b.onclick = () => { feeling = name; feelingsEl.querySelectorAll('.feel').forEach(x => x.setAttribute('aria-pressed', x === b)); };
  feelingsEl.append(b);
}
const updateCount = () => { countEl.textContent = `${msgEl.value.length}/90`; };
msgEl.addEventListener('input', updateCount);
msgEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

const linkFor = msg => `${location.href.split('#')[0]}#${new URLSearchParams({ m: msg.text, f: msg.feeling, ...(msg.sign && { s: msg.sign }) })}`;
function showToast(text, link) {
  toastText.textContent = text; toastLink.value = link;
  toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 9000);
}
document.getElementById('copyBtn').onclick = () => { toastLink.select(); navigator.clipboard?.writeText(toastLink.value).catch(() => document.execCommand('copy')); toastText.textContent = 'Link copied'; };

form.addEventListener('submit', async e => {
  e.preventDefault();
  const text = msgEl.value.trim();
  if (!text || nap.exitAt !== null) { msgEl.focus(); return; }
  const msg = { id: ++msgId, text, feeling, sign: signEl.value.trim() }, link = linkFor(msg);
  // never block on the clipboard: a pending permission prompt could stall the whole send
  const copied = within((navigator.clipboard?.writeText(link) ?? Promise.reject()).then(() => true, () => false), 1500, false);
  nap.exitAt = Infinity; // busy from now on
  await within(fontsReady, 800);
  sewMessage(msg, performance.now() - nap.born);
  nap.exitAt = nap.born + nap.sewEnd + 1000;
  nap.link = link; nap.copied = copied;
  msgEl.value = ''; updateCount();
});

addEventListener('hashchange', () => location.reload()); // a pasted link in an open tab still plays
const shared_ = new URLSearchParams(location.hash.slice(1));
const sharedFeeling = TOKENS[shared_.get('f')] ? shared_.get('f') : 'love';
newNapkin(performance.now(), shared_.get('m') ? sharedFeeling : feeling); // a received napkin is hemmed in the sender's colour
if (shared_.get('m')) { // someone opened a shared link: the napkin arrives and sews their message
  received = true;
  msgEl.placeholder = 'Sew a reply…';
  const msg = { id: ++msgId, text: shared_.get('m').slice(0, 90), feeling: sharedFeeling, sign: (shared_.get('s') || '').slice(0, 24) };
  within(fontsReady, 1500).then(() => sewMessage(msg, 0));
} else if (params.demo) within(fontsReady, 1500).then(() => sewMessage({ id: ++msgId, text: params.demo.slice(0, 90), feeling, sign: '' }, 0));

function status(sewT, el) {
  if (nap.exitAt !== null && sewT >= nap.sewEnd) return 'Sending…';
  if (el < UNFOLD[1]) return `Unfolding a fresh napkin, ${LABELS[nap.unfold]}…`;
  if (sewT < nap.hemEnd) return 'Sewing the hem…';
  if (sewT < nap.sewEnd) return nap.msg ? 'Sewing the message…' : 'Sewing…';
  return received && nap.msg ? 'Someone sent you a napkin — sew a reply' : 'Write something to sew, sign it, pick a feeling, and send it';
}

// ---------- render ----------
renderer.setAnimationLoop(now => {
  if (nap.exitAt !== null && nap.exitAt !== Infinity && now >= nap.exitAt) {
    const a = reduce ? EXIT[1] : now - nap.exitAt;
    if (a >= EXIT[1]) {
      const { link, copied } = nap;
      received = false;
      newNapkin(now);
      copied.then(ok => showToast(ok ? 'Sent — link copied' : 'Sent — share this link', link));
      applyPose(introPose(nap.unfold, reduce ? 1e6 : 0));
    } else applyPose(exitPose(a));
  } else applyPose(introPose(nap.unfold, now - nap.born));

  const sewT = now - nap.born, time = reduce ? 0 : now / 1000;
  shared.uTime.value = time;
  uSew.value = sewT;
  const S = nap.stitches;
  let drew = false;
  while (nap.shadowDone < S.length && S[nap.shadowDone].birth + S[nap.shadowDone].dur <= sewT) { shadowStitch(S[nap.shadowDone++]); drew = true; }
  if (drew) shadowTex.needsUpdate = true;
  updateNeedle(sewT, time);

  const text = status(sewT, now - nap.born);
  if (hint.textContent !== text) hint.textContent = text;
  const busy = nap.exitAt !== null || !msgEl.value.trim();
  if (sendBtn.disabled !== busy) sendBtn.disabled = busy;
  renderer.render(scene, camera);
});

// live params from the Animation Engine (timing, unfold and demo changes reload the page)
window.engine?.onParams(v => {
  Object.assign(params, v);
  shared.uGrain.value = params.grain;
  shared.uClothCol.value.set(...hex3(params.cloth));
});
window.engine?.onTheme(s => renderer.setClearColor(clearFor(s), 1));
</script>
</body>
</html>
